services:
  - type: web
    name: preordercards
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "PreorderCards <admin@preordercards.com>"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: MARKETPLACE_DISCORD_WEBHOOK_URL
        sync: false
      - key: STATS_SUMMARY_WEBHOOK_URL
        sync: false
      - key: GA4_PROPERTY_ID
        sync: false
      - key: GA4_SERVICE_ACCOUNT_KEY
        sync: false
      - key: DISCOUNT_SIGNUP_WEBHOOK_URL
        sync: false
      - key: VERIFIED_SELLER_WEBHOOK_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BLOG_AGENT_WEBHOOK_URL
        sync: false
      - key: SITE_URL
        value: https://preordercards.com
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: NEWSLETTER_ENABLED
        value: "false"
      - key: NEWSLETTER_SECRET
        sync: false
      - key: NEWSLETTER_WEBHOOK_URL
        sync: false
      - key: NEWSLETTER_AUDIENCE
        value: all
      - key: NEWSLETTER_SEND_HOUR
        value: "10"
      - key: NEWSLETTER_MAX_PER_RUN
        value: "500"
      - key: RELEASE_CHECK_ENABLED
        value: "false"
      - key: RELEASE_CHECK_HOUR
        value: "9"
      - key: RELEASE_CHECK_WEBHOOK_URL
        sync: false
      - key: RELEASE_CHECK_SOURCES
        sync: false
      - key: RELEASE_CHECK_USER_AGENT
        sync: false
      - key: RELEASE_CHECK_PROXIES
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
